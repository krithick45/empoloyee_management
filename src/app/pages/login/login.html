<div class="parent-login">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="login-card text-center">
          <div class="logo-circle">
            <img
  src="https://cdn-icons-png.flaticon.com/512/10743/10743163.png"
  alt="Employee Management Logo"
/>

          </div>
          <h3>Login</h3>
          <form [formGroup]="loginForm">
            <div class="mb-3 text-start">
              <label for="username" class="form-label text-light">Email</label>
              <input type="text" formControlName="emailId" class="form-control" id="username"
                placeholder="Enter your username" required>
            </div>
            <div class="mb-3 text-start">
              <label for="password" class="form-label text-light">Password</label>
              <input type="password" formControlName="password" class="form-control" id="password"
                placeholder="Enter your password" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
              <div class="form-check text-light">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Remember Me</label>
              </div>
              <div class="text-small mt-2 mt-sm-0">
                <a href="#">Forgot Password?</a>
              </div>
            </div>

            <button type="button" class="btn btn-login" (click)="login()">Login</button>
          </form>

          <p class="text-small mt-4 text-light">
            Don’t have an account? <a href="#">Contact Admin</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
